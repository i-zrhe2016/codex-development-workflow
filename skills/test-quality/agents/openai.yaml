interface:
  display_name: "Test Quality"
  short_description: "Run risk-aware verification with an explicit Test Quality Gate"
  default_prompt: "Use $test-quality when the current change needs verification evidence. Map acceptance criteria to evidence, select mandatory test dimensions from risk, run cheap focused checks first, add boundary/negative/property/mutation/integration/regression/browser checks when justified, diagnose flaky tests, and require the Test Quality Gate before PASS."
policy:
  allow_implicit_invocation: true
