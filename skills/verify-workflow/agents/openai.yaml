interface:
  display_name: "Verify Workflow"
  short_description: "Decide when to verify: scope, level, and a bounded result"
  default_prompt: "Use $verify-workflow: default single-agent execution with low reasoning effort; the main agent verifies Ticket and final Plan scope directly without spawning subagents or claiming independent verification. Only in explicitly authorized delegated mode dispatch fresh independent verifiers with high reasoning effort and apply exact-scope one-Ticket coalescing. Invoke $test-workflow and return PASS, FAIL or BLOCKED with evidence."
policy:
  allow_implicit_invocation: false
