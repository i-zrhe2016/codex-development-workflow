interface:
  display_name: "Verify Workflow"
  short_description: "Decide when to verify: scope, level, and a bounded result"
  default_prompt: "Use $verify-workflow to dispatch a fresh read-only Sol/high verifier per Ticket and for final Plan acceptance. Coalesce both gates only for a one-Ticket Plan with exactly matching scope, artifact/version, configuration, and deployment surface; invoke $test-workflow and return PASS, FAIL, or BLOCKED with evidence."
