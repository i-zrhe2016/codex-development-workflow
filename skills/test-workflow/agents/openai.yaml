  short_description: "Run risk-aware verification with explicit test quality gates"
  default_prompt: "Use $test-workflow for implementation feedback, one-verifier Ticket checks, or three-verifier final Plan/branch/PR acceptance; respect read-only verifier and no-recursive-dispatch boundaries; map acceptance criteria to evidence, select mandatory test dimensions from risk, run cheap focused checks first, add boundary/negative/property/mutation/integration/regression/browser checks when justified, diagnose flaky tests, and require the Test Quality Gate before PASS."
