<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1268px;height:404px;background:#FFFFFF;" width="1268px" height="404px" viewBox="0 0 1268 404" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="388.966" y="35.421" fill="#000" font-size="22" textLength="488.737" font-weight="700" font-family="Arial">Requirement → Plan → Behavior Tickets</text></g><!--entity requirement--><g class="entity" data-qualified-name="requirement" id="ent0001" data-source-line="8"><rect x="509.13" y="58.609" width="202.232" height="52.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="519.13" y="81.604" fill="#000" font-size="14" textLength="90.973" font-family="Arial">Requirement</text><text x="519.13" y="97.901" fill="#000" font-size="14" textLength="182.232" font-family="Arial">Persist every requirement</text></g><!--entity plan--><g class="entity" data-qualified-name="plan" id="ent0002" data-source-line="9"><rect x="366.53" y="188.199" width="235.428" height="68.891" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="376.53" y="211.194" fill="#000" font-size="14" textLength="103.394" font-family="Arial">One Plan Issue</text><text x="376.53" y="227.491" fill="#000" font-size="14" textLength="215.428" font-family="Arial">Plan + indexed Ticket sections</text><text x="376.53" y="243.788" fill="#000" font-size="14" textLength="196.69" font-family="Arial">Owns branch + PR + merge</text></g><!--entity ordinary--><g class="entity" data-qualified-name="ordinary" id="ent0003" data-source-line="10"><rect x="12" y="335.489" width="172.496" height="52.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="22" y="358.484" fill="#000" font-size="14" textLength="152.496" font-family="Arial">Ordinary requirement</text><text x="22" y="374.781" fill="#000" font-size="14" textLength="130.177" font-family="Arial">One Ticket section</text></g><!--entity complex--><g class="entity" data-qualified-name="complex" id="ent0004" data-source-line="11"><rect x="219.01" y="335.489" width="250.474" height="52.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="229.01" y="358.484" fill="#000" font-size="14" textLength="153.104" font-family="Arial">Complex requirement</text><text x="229.01" y="374.781" fill="#000" font-size="14" textLength="230.474" font-family="Arial">Multiple behavior Ticket sections</text></g><!--entity original_ticket--><g class="entity" data-qualified-name="original_ticket" id="ent0005" data-source-line="12"><rect x="504.91" y="335.489" width="238.675" height="52.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="514.91" y="358.484" fill="#000" font-size="14" textLength="101.582" font-family="Arial">Original Ticket</text><text x="514.91" y="374.781" fill="#000" font-size="14" textLength="218.675" font-family="Arial">Supplement same requirement</text></g><!--entity new_plan--><g class="entity" data-qualified-name="new_plan" id="ent0006" data-source-line="13"><rect x="637.15" y="196.349" width="200.188" height="52.594" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><text x="647.15" y="219.344" fill="#000" font-size="14" textLength="64.771" font-family="Arial">New Plan</text><text x="647.15" y="235.641" fill="#000" font-size="14" textLength="180.188" font-family="Arial">Independent requirement</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="22"><path d="M778.83,334.089 L778.83,389.488 L1253.668,389.488 L1253.668,344.089 L1243.668,334.089 L778.83,334.089" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1243.668,334.089 L1243.668,344.089 L1253.668,344.089 L1243.668,334.089" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="784.83" y="351.156" fill="#000" font-size="13" textLength="334.794" font-family="Arial">Add a Ticket only for a genuine behavior boundary.</text><text x="784.83" y="366.289" fill="#000" font-size="13" textLength="453.838" font-family="Arial">Internal implementation steps need no separate IDs, status, or gates.</text><text x="784.83" y="381.422" fill="#000" font-size="13" textLength="335.175" font-family="Arial">Publication and merge occur only when authorized.</text></g><!--link requirement to plan--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="15" data-link-type="dependency"><path d="M586.55,111.439 C566.52,133.019 541.061,160.445 519.101,184.105" style="stroke:#000;stroke-width:1;" fill="none" id="requirement-to-plan"/><polygon points="515.7,187.769,524.754,183.894,519.101,184.105,518.891,178.452,515.7,187.769" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="559.53" y="154.266" fill="#000" font-size="13" textLength="69.494" font-family="Arial">persists as</text></g><!--link plan to ordinary--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="16" data-link-type="dependency"><path d="M366.09,257.009 C335.94,266.159 303.73,276.499 274.25,287.089 C234.03,301.539 194.243,318.139 160.103,333.039" style="stroke:#000;stroke-width:1;" fill="none" id="plan-to-ordinary"/><polygon points="155.52,335.039,165.369,335.105,160.103,333.039,162.169,327.773,155.52,335.039" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="275.25" y="300.156" fill="#000" font-size="13" textLength="96.662" font-family="Arial">ordinary scope</text></g><!--link plan to complex--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk9" data-source-line="17" data-link-type="dependency"><path d="M429.38,257.579 C417.13,266.409 404.7,276.449 394.25,287.089 C380.16,301.429 370.073,315.928 36